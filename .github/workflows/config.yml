name: Repository config actions

on:
    push:
        branches: [main]
    workflow_dispatch: # Manual trigger
        inputs:
            locale_override:
                description: "Force locale (ko|en). If empty, detect from actor profile location."
                required: false
                type: choice
                options:
                    - ""
                    - ko
                    - en

permissions:
    contents: write
    pull-requests: write # Pull request

jobs:
    pull_request_localization:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Detect locale from actor profile
              id: detect_locale
              uses: actions/github-script@v7
              with:
                script: |
                    const actor = context.actor;
                    const override = `${{ toJson(github.event.inputs.locale_override) || '""' }}`.replace(/^"|"$/g, '');

                    if (override === 'ko' || override === 'en') {
                      core.info(`Using locale override: ${override}`);
                      core.setOutput('locale', override);
                      return;
                    }

                    const { data: user } = await github.rest.users.getByUsername({ username: actor });
                    const location = (user.location || '').trim();

                    // Hard rule:
                    // - Korea-related locations => ko
                    // - all other cases => en
                    // Nationality data is not available via GitHub event/API.
                    const koHints = [
                      /\bsouth korea\b/i,
                      /\brepublic of korea\b/i,
                      /\bkorea\b/i,
                      /\bkr\b/i,
                      /대한민국/i,
                      /한국/i,
                      /서울/i,
                      /부산/i,
                      /인천/i
                    ];

                    const locale = koHints.some((re) => re.test(location)) ? 'ko' : 'en';

                    core.info(`actor=${actor}, location='${location}', locale=${locale}`);
                    core.setOutput('locale', locale);

            - name: Apply PR localization
              env:
                LOCALE: ${{ steps.detect_locale.outputs.locale }}
              run: |
                echo "Selected locale: ${LOCALE}"
                if [ "${LOCALE}" = "ko" ]; then
                  echo "Use Korean PR localization flow"
                  # Example:
                  # cp .github/PULL_REQUEST_TEMPLATE.ko.md .github/pull_request_template.md
                else
                  echo "Use English PR localization flow"
                  # Example:
                  # cp .github/PULL_REQUEST_TEMPLATE.md .github/pull_request_template.md
                fi